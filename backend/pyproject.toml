[project]
name = "stats-analyst"
version = "0.1.0"
description = "LLM-assisted statistical analyst: an agent that plans, runs and explains hypothesis tests on your CSV data."
authors = [{ name = "Mario Recabarren" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "fastapi>=0.164.0",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
